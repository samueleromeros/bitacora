<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Bitácora</title>
<meta name="description" content="Calendario personal de entrenamiento, objetivos y tareas.">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C1B19">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-frame">

  <header class="app-header">
    <div>
      <span class="eyebrow" id="header-eyebrow">bitácora</span>
      <h1 id="header-title">Hoy</h1>
    </div>
    <button class="icon-btn" id="btn-settings" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" width="19" height="19" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 005.68 15a1.65 1.65 0 00-1.51-1H4a2 2 0 010-4h.09A1.65 1.65 0 005.68 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6c.36-.16.62-.5.65-.9V3a2 2 0 014 0v.09c.03.4.29.74.65.9a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9c.16.36.5.62.9.65H21a2 2 0 010 4h-.09c-.4.03-.74.29-.9.65z"/>
      </svg>
    </button>
  </header>

  <main class="views">

    <!-- HOY -->
    <section class="view active" id="view-hoy">
      <div class="today-hero">
        <div>
          <div class="date-big" id="hoy-date-big">--</div>
          <div class="date-sub" id="hoy-date-sub">-- -- ----</div>
        </div>
        <div class="streak-pill" id="hoy-streak" style="display:none;"></div>
      </div>

      <div class="section-title">Entrenamiento de hoy</div>
      <div id="hoy-routine"></div>

      <div class="section-title">Tareas de hoy</div>
      <div id="hoy-todos"></div>

      <div class="section-title" id="hoy-goals-title" style="display:none;">Objetivos próximos</div>
      <div id="hoy-goals"></div>
    </section>

    <!-- CALENDARIO -->
    <section class="view" id="view-calendario">
      <div class="cal-nav">
        <button class="icon-btn" id="cal-prev" aria-label="Mes anterior">‹</button>
        <div class="cal-month" id="cal-month-label">--</div>
        <button class="icon-btn" id="cal-next" aria-label="Mes siguiente">›</button>
      </div>
      <div class="cal-grid" id="cal-dow-row"></div>
      <div class="cal-grid" id="cal-grid" style="margin-top:4px;"></div>

      <div class="day-detail" id="day-detail"></div>
    </section>

    <!-- RUTINAS -->
    <section class="view" id="view-rutinas">
      <div class="section-title">Resumen semanal</div>
      <div class="card" id="weekly-schedule-card"></div>

      <div class="section-title">Tus rutinas</div>
      <div id="routines-list"></div>
    </section>

    <!-- OBJETIVOS -->
    <section class="view" id="view-objetivos">
      <div id="goals-list"></div>
    </section>

    <!-- PROGRAMA (se abre desde cualquier objetivo de tipo "Programa": japonés, piano, etc.) -->
    <section class="view" id="view-programa">
      <button class="btn btn-ghost btn-sm" id="jp-back" style="width:auto;margin-bottom:16px;">‹ Volver a Objetivos</button>

      <div class="chip-row" id="jp-main-tabs" style="margin-bottom:18px;">
        <button class="chip active" data-jptab="programa">Programa</button>
        <button class="chip" id="jp-char-tab-btn" data-jptab="caracteres" style="display:none;">Caracteres</button>
      </div>

      <div id="jp-programa-panel">
        <input type="file" id="jp-upload-file" accept=".md,.txt,text/markdown,text/plain" style="display:none;">
        <button class="btn btn-primary" id="jp-upload-btn" style="margin-bottom:16px;">+ Subir semana</button>
        <div id="jp-weeks-list"></div>
      </div>

      <div id="jp-caracteres-panel" style="display:none;">
        <div class="chip-row" id="jp-char-tabs" style="margin-bottom:14px;">
          <button class="chip active" data-chartab="hiragana">Hiragana</button>
          <button class="chip" data-chartab="katakana">Katakana</button>
          <button class="chip" data-chartab="kanji">Kanji</button>
        </div>
        <div class="ti-meta" id="jp-char-progress" style="margin-bottom:14px;"></div>
        <div id="jp-char-grid"></div>
      </div>
    </section>

    <!-- TAREAS -->
    <section class="view" id="view-tareas">
      <div class="chip-row" id="todo-filter-row" style="margin-bottom:14px;">
        <button class="chip active" data-filter="pending">Pendientes</button>
        <button class="chip" data-filter="done">Hechas</button>
        <button class="chip" data-filter="all">Todas</button>
      </div>
      <div id="todos-full-list"></div>
    </section>

  </main>

  <button class="fab" id="fab-add" aria-label="Agregar">+</button>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="hoy">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="7" y2="7"/><line x1="17" y1="17" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="7" y2="17"/><line x1="17" y1="7" x2="19.1" y2="4.9"/></svg>
      Hoy
    </button>
    <button class="nav-btn" data-view="calendario">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
      Calendario
    </button>
    <button class="nav-btn" data-view="rutinas">
      <svg viewBox="0 0 24 24"><line x1="6" y1="12" x2="18" y2="12"/><rect x="2" y="9" width="3" height="6" rx="1"/><rect x="19" y="9" width="3" height="6" rx="1"/><rect x="6" y="7" width="2" height="10" rx="1"/><rect x="16" y="7" width="2" height="10" rx="1"/></svg>
      Rutinas
    </button>
    <button class="nav-btn" data-view="objetivos">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.2"/><circle cx="12" cy="12" r="0.8" fill="currentColor"/></svg>
      Objetivos
    </button>
    <button class="nav-btn" data-view="tareas">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M7 9l2 2 3-3"/><line x1="13" y1="9" x2="18" y2="9"/><path d="M7 15l2 2 3-3"/><line x1="13" y1="15" x2="18" y2="15"/></svg>
      Tareas
    </button>
  </nav>
</div>

<!-- Modal genérico -->
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" id="modal" role="dialog" aria-modal="true">
    <div class="modal-handle"></div>
    <div id="modal-content"></div>
  </div>
</div>

<script src="db.js"></script>
<script src="japanese-data.js"></script>
<script src="programs.js"></script>
<script src="notifications.js"></script>
<script src="app.js"></script>
</body>
</html>
